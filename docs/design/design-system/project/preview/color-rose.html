<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);padding:22px;color:var(--ink)}
  .scale{display:flex;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hairline)}
  .step{flex:1;height:72px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
  .lbl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
</style></head>
<body>
  <p class="lbl">Rose — primary accent</p>
  <div class="scale">
    <div class="step" style="background:var(--rose-50);color:#B22F52">50</div>
    <div class="step" style="background:var(--rose-100);color:#B22F52">100</div>
    <div class="step" style="background:var(--rose-200);color:#B22F52">200</div>
    <div class="step" style="background:var(--rose-300);color:#fff">300</div>
    <div class="step" style="background:var(--rose-400);color:#fff">400</div>
    <div class="step" style="background:var(--rose-500);color:#fff">500</div>
    <div class="step" style="background:var(--rose-600);color:#fff">600</div>
    <div class="step" style="background:var(--rose-700);color:#fff">700</div>
  </div>
</body></html>
