<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);padding:22px;color:var(--ink)}
  .line{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid var(--hairline)}
  .line:last-child{border:0}
  .k{flex:0 0 138px;font-family:var(--font-sans);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="line"><span class="k">display · 40 · 500</span><span class="display">Never lose them</span></div>
  <div class="line"><span class="k">h1 · 31 · 500</span><span class="h1">A quiet Tuesday</span></div>
  <div class="line"><span class="k">h2 · 24 · 600</span><span class="h2">Your moments</span></div>
  <div class="line"><span class="k">h3 · 20 · 600</span><span class="h3">This week</span></div>
</body></html>
