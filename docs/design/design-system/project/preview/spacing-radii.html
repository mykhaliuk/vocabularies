<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);padding:22px;color:var(--ink)}
  .row{display:flex;gap:16px;align-items:flex-end}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:74px;height:74px;background:var(--rose-100);border:1.5px solid var(--rose-300)}
  .n{font-size:12px;font-weight:600}
  .v{font-size:11px;color:var(--ink-2)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--r-xs)"></div><div class="n">xs</div><div class="v">6px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-sm)"></div><div class="n">sm</div><div class="v">10px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-md)"></div><div class="n">md</div><div class="v">14px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-lg)"></div><div class="n">lg</div><div class="v">20px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-xl)"></div><div class="n">xl</div><div class="v">28px</div></div>
    <div class="item"><div class="box" style="border-radius:var(--r-pill)"></div><div class="n">pill</div><div class="v">999px</div></div>
  </div>
</body></html>
