<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);padding:22px;color:var(--ink);display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  .tile{display:flex;flex-direction:column;align-items:center;gap:9px}
  .lbl{font-size:11px;color:var(--ink-3)}
  .ink{background:var(--ink);padding:18px 22px;border-radius:var(--r-lg)}
  .app{width:78px;height:78px;border-radius:20px;box-shadow:var(--shadow-md)}
</style></head>
<body>
  <div class="tile"><img src="../assets/logo-wordmark.svg" height="44"><span class="lbl">Primary lockup</span></div>
  <div class="tile"><img src="../assets/logo-mark.svg" height="60"><span class="lbl">Mark</span></div>
  <div class="tile"><img class="app" src="../assets/logo-mark.svg"><span class="lbl">App icon</span></div>
  <div class="tile ink"><img src="../assets/logo-mark.svg" height="48"><span class="lbl" style="color:#cfc8bf">On ink</span></div>
</body></html>
