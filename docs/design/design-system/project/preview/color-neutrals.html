<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);padding:22px;color:var(--ink)}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--hairline)}
  .chip{height:58px}
  .info{padding:7px 9px;background:var(--surface)}
  .info .name{font-size:12px;font-weight:600}
  .info .hex{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="info"><div class="name">Paper</div><div class="hex">#FBFEFF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="info"><div class="name">Surface</div><div class="hex">#FFFFFF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-sunk)"></div><div class="info"><div class="name">Sunk</div><div class="hex">#F1F4F6</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--hairline)"></div><div class="info"><div class="name">Hairline</div><div class="hex">#EAEDEF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-3)"></div><div class="info"><div class="name">Ink-3</div><div class="hex">#969BA1</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="info"><div class="name">Ink-2</div><div class="hex">#61676C</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="info"><div class="name">Ink</div><div class="hex">#1B1D1E</div></div></div>
  </div>
</body></html>
