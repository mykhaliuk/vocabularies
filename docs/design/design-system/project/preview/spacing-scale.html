<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);padding:22px;color:var(--ink)}
  .line{display:flex;align-items:center;gap:14px;margin-bottom:9px}
  .bar{height:16px;background:var(--blue-300);border-radius:3px}
  .k{flex:0 0 70px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
  .v{font-size:11px;color:var(--ink-2)}
</style></head>
<body>
  <div class="line"><span class="k">1 · 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="line"><span class="k">2 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="line"><span class="k">3 · 12px</span><div class="bar" style="width:12px"></div></div>
  <div class="line"><span class="k">4 · 16px</span><div class="bar" style="width:16px"></div><span class="v">screen gutter</span></div>
  <div class="line"><span class="k">6 · 24px</span><div class="bar" style="width:24px"></div></div>
  <div class="line"><span class="k">8 · 32px</span><div class="bar" style="width:32px"></div></div>
  <div class="line"><span class="k">12 · 48px</span><div class="bar" style="width:48px"></div></div>
</body></html>
