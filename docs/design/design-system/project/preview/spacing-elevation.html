<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);font-family:var(--font-sans);padding:26px 22px;color:var(--ink)}
  .row{display:flex;gap:22px}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:96px;height:64px;background:var(--surface);border-radius:var(--r-md)}
  .n{font-size:12px;font-weight:600}
  .v{font-size:11px;color:var(--ink-2);text-align:center}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm</div><div class="v">cards at rest</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="n">md</div><div class="v">menus · popovers</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg</div><div class="v">sheets · modals</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-float);background:var(--rose-500)"></div><div class="n">float</div><div class="v">FAB · compose</div></div>
  </div>
</body></html>
