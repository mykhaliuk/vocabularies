<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);padding:22px;color:var(--ink)}
  .line{display:flex;align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid var(--hairline)}
  .line:last-child{border:0}
  .k{flex:0 0 150px;font-family:var(--font-sans);font-size:11px;color:var(--ink-3)}
</style></head>
<body>
  <div class="line"><span class="k">meta · 14 sans 500</span><span class="meta">@lina · 3h ago · saved to Spring</span></div>
  <div class="line"><span class="k">caption · 12 sans 500</span><span class="caption">Edited · only you can see this</span></div>
  <div class="line"><span class="k">overline · 12 caps tracked</span><span class="overline">On this day</span></div>
</body></html>
