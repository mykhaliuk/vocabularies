<!-- @dsCard group="Type" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--paper);padding:22px;color:var(--ink);font-family:var(--font-sans)}
  .tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
  .name{font-size:13px;color:var(--ink-2);margin:4px 0 10px}
  .spec{font-size:52px;font-weight:500;line-height:1;letter-spacing:-.03em}
  .weights{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:17px}
  .weights span{color:var(--ink)}
  .hand{margin-top:22px;padding-top:18px;border-top:1px solid var(--hairline)}
  .hand .spec{font-family:var(--font-hand);font-weight:700;font-size:56px;letter-spacing:0;color:var(--ink)}
</style></head>
<body>
  <div class="tag">Single family · UI · body · display</div>
  <div class="name">Rubik</div>
  <div class="spec">Sweet moments</div>
  <div class="weights">
    <span style="font-weight:400">Regular</span>
    <span style="font-weight:500">Medium</span>
    <span style="font-weight:600">Semibold</span>
    <span style="font-weight:700">Bold</span>
    <span style="font-weight:800">Extra</span>
    <span style="font-weight:500;font-style:italic">Italic</span>
  </div>
  <div class="hand">
    <div class="tag">Handwriting accent · the captured word only</div>
    <div class="name">Caveat · <code style="font-family:var(--font-sans)">--font-hand</code></div>
    <div class="spec">Appo · Mangia!</div>
  </div>
</body></html>
