<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vocabu</title>
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: #DFE5E9;
      font-family: var(--font-sans);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; box-sizing: border-box;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    .device {
      position: relative; width: 390px; height: 844px;
      background: var(--paper); border-radius: 46px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.14), 0 30px 70px rgba(40,38,36,0.34);
      padding: 12px; box-sizing: border-box;
    }
    .device::after {
      content: ""; position: absolute; inset: 0; border-radius: 46px;
      border: 1px solid rgba(255,255,255,0.5); pointer-events: none;
    }
    .screen {
      position: relative; width: 100%; height: 100%;
      border-radius: 36px; overflow: hidden; background: var(--paper); --safe-bottom: 8px;
    }
    .statusbar {
      position: absolute; top: 0; left: 0; right: 0; height: 44px; z-index: 70;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; font-family: var(--font-sans); font-size: 14px; font-weight: 700; color: var(--ink);
      pointer-events: none;
    }
    .statusbar .right { display: flex; gap: 6px; align-items: center; }
    .notch {
      position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
      width: 112px; height: 30px; background: #0C0E10; border-radius: 16px; z-index: 75;
    }
    #root { position: absolute; inset: 0; top: 44px; }
    /* hide scrollbars app-wide, keep scrolling */
    #root *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    #root * { scrollbar-width: none; -ms-overflow-style: none; }
    /* gentle motion — entrances + functional indicators only */
    @keyframes vfadeup { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes vpop { from { opacity: 0; transform: scale(0.82); } to { opacity: 1; transform: scale(1); } }
    @keyframes vbarin { from { transform: scaleY(0.25); opacity: 0.5; } to { transform: scaleY(1); opacity: 1; } }
    @keyframes vrecpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes vfloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @media (max-width: 430px) {
      body { padding: 0; background: var(--paper); }
      .device { width: 100vw; height: 100vh; height: 100dvh; min-height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
      .device::after { display: none; }
      .screen { border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="screen">
      <div class="notch"></div>
      <div class="statusbar">
        <span>9:41</span>
        <span class="right">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="3" width="3" height="6" rx="1"/><rect x="5" y="1.5" width="3" height="9" rx="1"/><rect x="10" y="0" width="3" height="12" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.4"/></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="none"><rect x="0.6" y="0.6" width="18" height="10.8" rx="2.6" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="13" height="8" rx="1.4" fill="currentColor"/><rect x="20" y="3.6" width="1.6" height="4.8" rx="0.8" fill="currentColor" opacity="0.5"/></svg>
        </span>
      </div>
      <div id="root"></div>
    </div>
  </div>

  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="feed.jsx"></script>
  <script type="text/babel" src="chrome.jsx"></script>
  <script type="text/babel" src="voice.jsx"></script>
  <script type="text/babel" src="compose.jsx"></script>
  <script type="text/babel" src="detail.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="auth_offline.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
