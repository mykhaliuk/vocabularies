<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>not in the dictionary · Vocabu</title>
  <link rel="stylesheet" href="colors_and_type.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Dark theme — derived in the DS spirit (near-black surfaces, near-white ink,
       rose + blue preserved); follows the device setting. Mirrors the app. */
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #15171A; --surface: #1E2125; --surface-sunk: #282C31;
        --ink: #ECEEF0; --ink-2: #9AA0A6; --ink-3: #6B7177;
        --hairline: #2B2F34; --hairline-2: #3A4046;
        --rose-700: #F687A3; --blue-700: #7CCBEF;
        --primary-soft: rgba(237,83,121,0.18);
        --secondary-soft: rgba(31,158,219,0.15);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #DFE5E9;
      font-family: var(--font-sans);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    @media (prefers-color-scheme: dark) { body { background: #0A0B0D; } }

    .device {
      position: relative; width: 390px; height: 844px;
      background: var(--paper); border-radius: 46px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.14), 0 30px 70px rgba(40,38,36,0.34);
      padding: 12px;
    }
    .device::after {
      content: ""; position: absolute; inset: 0; border-radius: 46px;
      border: 1px solid rgba(255,255,255,0.5); pointer-events: none;
    }
    .screen {
      position: relative; width: 100%; height: 100%;
      border-radius: 36px; overflow: hidden; background: var(--paper);
      --safe-bottom: 8px;
    }
    .notch {
      position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
      width: 112px; height: 30px; background: #0C0E10; border-radius: 16px; z-index: 75;
    }
    .statusbar {
      position: absolute; top: 0; left: 0; right: 0; height: 44px; z-index: 70;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; font-size: 14px; font-weight: 700; color: var(--ink);
      pointer-events: none;
    }
    .statusbar .right { display: flex; gap: 6px; align-items: center; }

    /* faint rose/blue wash — the one decorative exception, kept barely-there */
    .stage {
      position: absolute; inset: 0; top: 44px;
      background:
        radial-gradient(118% 70% at 12% -2%, rgba(237,83,121,0.055), transparent 52%),
        radial-gradient(120% 72% at 92% 104%, rgba(31,158,219,0.05), transparent 54%),
        var(--paper);
      display: flex; flex-direction: column;
    }
    @media (prefers-color-scheme: dark) {
      .stage { background:
        radial-gradient(118% 70% at 12% -2%, rgba(237,83,121,0.11), transparent 52%),
        radial-gradient(120% 72% at 92% 104%, rgba(31,158,219,0.10), transparent 54%),
        var(--paper); }
    }

    /* top: brand + a quiet close (rare action, top-left per DS thumb rules) */
    .topbar {
      flex: 0 0 auto; height: 54px; display: flex; align-items: center; padding: 0 8px;
    }
    .icon-btn {
      width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer;
      color: var(--ink-2); display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
    }
    .brand {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .brand img { display: block; border-radius: 6px; }
    .brand span {
      font-size: 21px; font-weight: 700; letter-spacing: -0.03em; color: var(--ink);
    }
    .topbar .spacer { width: 44px; height: 44px; flex: 0 0 auto; }

    /* the "entry" — 404 rendered in Vocabu's own entry anatomy */
    .entry {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; gap: 16px; padding: 0 30px 40px;
      animation: fadeup 420ms var(--ease-out) both;
    }
    .overline {
      font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink-3); white-space: nowrap;
    }
    .word {
      font-family: 'Caveat', var(--font-sans); font-weight: 600;
      font-size: 44px; line-height: 1.04; letter-spacing: 0; color: var(--ink);
      margin: 2px 0; white-space: nowrap;
    }
    .word .q { color: var(--ink-3); font-weight: 500; }
    .gloss {
      font-size: 17px; font-style: italic; color: var(--ink-2);
    }

    /* a silent sample — the app's audio vocabulary, emptied */
    .silent {
      display: flex; align-items: center; gap: 14px; width: 100%; max-width: 300px;
      margin: 8px auto 2px; opacity: 0.92;
    }
    .silent .play {
      width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto;
      border: 1.5px solid var(--hairline-2); background: transparent;
      color: var(--ink-3); display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .silent .line {
      position: relative; flex: 1; height: 24px;
      display: flex; align-items: center;
    }
    .silent .line::before {
      content: ""; position: absolute; left: 0; right: 0; top: 50%;
      height: 2px; border-radius: 2px; transform: translateY(-50%);
      background: repeating-linear-gradient(to right,
        var(--hairline-2) 0 4px, transparent 4px 9px);
    }
    .silent .cap {
      font-size: 12.5px; font-weight: 500; color: var(--ink-3); flex: 0 0 auto;
    }
    .silent-note {
      font-size: 13.5px; color: var(--ink-3); margin-top: 2px;
    }

    .actions {
      display: flex; flex-direction: column; align-items: stretch; gap: 4px;
      width: 100%; max-width: 300px; margin-top: 20px;
    }
    .btn {
      font-family: var(--font-sans); font-weight: 600; font-size: 16px;
      border: 0; cursor: pointer; border-radius: var(--r-btn);
      min-height: 50px; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; text-decoration: none;
      transition: transform var(--dur-fast) var(--ease-out), filter var(--dur-fast);
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--primary); color: var(--text-on-accent);
      box-shadow: var(--shadow-float);
    }
    .btn-primary:hover { filter: brightness(0.96); }
    .btn-ghost {
      background: transparent; color: var(--link); min-height: 44px;
    }
    .btn-ghost:hover { background: var(--secondary-soft); }

    .ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; }

    @keyframes fadeup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .entry { animation: none; } .btn:active { transform: none; } }

    @media (max-width: 430px) {
      body { padding: 0; background: var(--paper); }
      .device { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
      .device::after { display: none; }
      .screen { border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="screen">
      <div class="notch"></div>
      <div class="statusbar">
        <span>9:41</span>
        <span class="right">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="3" width="3" height="6" rx="1"/><rect x="5" y="1.5" width="3" height="9" rx="1"/><rect x="10" y="0" width="3" height="12" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.4"/></svg>
          <svg width="22" height="12" viewBox="0 0 22 12" fill="none"><rect x="0.6" y="0.6" width="18" height="10.8" rx="2.6" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="13" height="8" rx="1.4" fill="currentColor"/><rect x="20" y="3.6" width="1.6" height="4.8" rx="0.8" fill="currentColor" opacity="0.5"/></svg>
        </span>
      </div>

      <div class="stage">
        <div class="topbar">
          <a class="icon-btn" href="index.html" aria-label="close">
            <svg class="ico" style="width:22px;height:22px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </a>
          <div class="brand">
            <img src="assets/logo-mark.svg" alt="" width="22" height="22" />
            <span>Vocabu</span>
          </div>
          <div class="spacer"></div>
        </div>

        <div class="entry">
          <div class="overline">not in the dictionary</div>

          <h1 class="word"><span class="q">“</span>four&#8209;oh&#8209;four<span class="q">”</span></h1>

          <div class="gloss">a page that isn't here</div>

          <div class="silent" aria-hidden="true">
            <span class="play">
              <svg class="ico" style="width:14px;height:14px" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </span>
            <span class="line"></span>
            <span class="cap">—:—</span>
          </div>
          <div class="silent-note">nothing to play — this one was never kept.</div>

          <div class="actions">
            <a class="btn btn-primary" href="index.html">
              <svg class="ico" style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7M5 12h14"/></svg>
              back to your words
            </a>
            <a class="btn btn-ghost" href="index.html">search your dictionary</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
