name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Design system sync
        run: bun run ds:check

      - name: Prototype ↔ design system drift
        run: bun run proto:check

      - name: i18n key parity
        run: bun run i18n:check

      - name: Server layering
        run: bun run layering:check

      - name: Capability graph freshness
        run: bun run graph:check

      - name: Change artifacts
        run: bun run spec:check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck E2E
        run: bun run typecheck:e2e

      - name: Unit tests
        run: bun run test:unit

      # Last on purpose: the only gate that queries a third party (the Google
      # Fonts catalogue), so an upstream outage cannot stop the deterministic
      # checks above from reporting.
      - name: Font coverage
        run: bun run fonts:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: bun run test:e2e

  # Everything behind `middleware: 'auth'` (VKB-101). Its own job so the smoke
  # suite above keeps running with no infra, unconditionally.
  e2e-authed:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vocabu
          POSTGRES_PASSWORD: vocabu
          POSTGRES_DB: vocabu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocabu -d vocabu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Stage `local` is what makes this runnable without cloud services: the
      # console emailer prints magic links (the suite reads them), Redis and
      # the rate limiters use their null drivers, and the session cookie is not
      # Secure — required over plain http. Any other stage would send real mail.
      APP_ENV: local
      DB_DRIVER: pg
      # Throwaway credentials for the service container above; they authorize
      # nothing outside this runner.
      DATABASE_URL: postgresql://vocabu:vocabu@localhost:5432/vocabu
      DATABASE_URL_UNPOOLED: postgresql://vocabu:vocabu@localhost:5432/vocabu
      JWT_SECRET: ci-only-throwaway-jwt-secret-never-used-in-a-deployed-env
      # A real bucket for the media path (VKB-115): the values mirror what
      # docker-compose's minio-init provisions, so CI and a local run speak to
      # the same MinIO layout. These credentials only exist inside the runner.
      S3_ENDPOINT: http://localhost:9100
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_MEDIA: vocabu-media-local
      S3_BUCKET_ORIGINALS: vocabu-originals-local
      S3_MEDIA_ACCESS_KEY_ID: vocabu-media-local
      S3_MEDIA_SECRET_ACCESS_KEY: vocabu-media-local-secret
      S3_ORIGINALS_ACCESS_KEY_ID: vocabu-originals-local
      S3_ORIGINALS_SECRET_ACCESS_KEY: vocabu-originals-local-secret

    steps:
      - uses: actions/checkout@v4

      # MinIO is not a service container because its image needs a command
      # (`server /data`), which services cannot pass. Reusing docker-compose
      # keeps one provisioning source: minio-init creates the buckets and the
      # per-bucket users the env above names.
      - name: Start MinIO
        run: docker compose up -d --wait minio && docker compose run --rm minio-init

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      # drizzle-kit directly, NOT scripts/migrate-deploy.js: that wrapper exits
      # 0 when DATABASE_URL_UNPOOLED is unset, which would hand us a green build
      # against an empty database. drizzle.config.js throws on a missing URL and
      # drizzle-kit exits non-zero on a failed migration, so this step is loud.
      # The suite's global setup then refuses to run if the tables are absent.
      - name: Apply migrations
        run: bunx drizzle-kit migrate

      # The :ci variant is the same invocation without the infra:up/db:migrate
      # links, which the job already does itself. One script owns the config
      # path, so a future flag cannot land on only one of the two paths.
      - name: E2E authed tests
        run: bun run test:e2e:authed:ci

      # Traces (trace: on-first-retry) are the only way to debug a failure
      # that does not reproduce locally.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-authed-traces
          path: test-results/authed/
          retention-days: 7
