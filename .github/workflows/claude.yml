name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [review_requested]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Instant "seen" signal on the triggering mention, before the agent
      # posts its tracking comment. Best-effort: never fails the run.
      - name: React with eyes on the trigger
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          case "${{ github.event_name }}" in
            issue_comment)
              endpoint="repos/$REPO/issues/comments/${{ github.event.comment.id }}/reactions" ;;
            pull_request_review_comment)
              endpoint="repos/$REPO/pulls/comments/${{ github.event.comment.id }}/reactions" ;;
            issues)
              endpoint="repos/$REPO/issues/${{ github.event.issue.number }}/reactions" ;;
            *)
              exit 0 ;;
          esac
          gh api -X POST "$endpoint" -f content=eyes --silent || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        # Workaround for anthropics/claude-code-action#676: the execute phase
        # loses the token unless it is ALSO present as a step env var.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          # Claude Pro/Max subscription auth (no API billing).
          # Rotate via `claude setup-token` + `gh secret set CLAUDE_CODE_OAUTH_TOKEN`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Temporary while stabilizing the setup: surface the SDK stream in logs.
          show_full_output: true
          # Let the CI agent actually build, verify, and inspect: deps,
          # scripts, checks, read-only git/gh state, local HTTP checks.
          claude_args: |
            --allowedTools "Bash(bun install),Bash(bun run:*),Bash(bunx:*),Bash(node:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status),Bash(git fetch:*),Bash(git rev-list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh issue view:*),Bash(curl:*),WebFetch,WebSearch"

  # Requesting a review from the agent account = "review this PR".
  # Fires only for claude-agent-myka, so human or Copilot review
  # requests never trigger it.
  review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.requested_reviewer.login == 'claude-agent-myka'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review the pull request
        uses: anthropics/claude-code-action@v1
        # Workaround for anthropics/claude-code-action#676: the execute phase
        # loses the token unless it is ALSO present as a step env var.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the requested reviewer on this pull request. Do a
            thorough code review:

            1. Read CLAUDE.md and every file in .claude/rules/ first —
               they are the review baseline (conventions, error handling,
               design-token rules, no-DTO policy).
            2. Read the PR description and the full diff (`gh pr diff`).
            3. Check: correctness, silent failures, convention violations
               (Conventional Commit title, tokens-only CSS, English-only
               code), scope creep, missing verification.
            4. If the change is testable, run the repo checks
               (bun install, bun run lint, bun run ds:check) and report
               results.
            5. Leave inline comments on specific lines where something is
               wrong via mcp__github_inline_comment__create_inline_comment.
            6. Finish by POSTING one summary comment with
               `gh pr comment ${{ github.event.pull_request.number }} --body "..."`:
               verdict (LGTM / needs changes), the list of findings
               ordered by severity, and what you checked. Be specific
               and terse; no praise padding. This runs unattended —
               never ask for confirmation, just post.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh run view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git status),Bash(git fetch:*),Bash(git rev-list:*),Bash(bun install),Bash(bun run:*),Bash(bunx:*),Bash(node:*),Bash(curl:*),WebFetch,WebSearch"
