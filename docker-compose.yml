services:
  postgres:
    image: postgres:18-alpine
    container_name: vocabu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocabu
      POSTGRES_PASSWORD: vocabu
      POSTGRES_DB: vocabu
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vocabu -d vocabu']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: vocabu-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:3000'
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: vocabu-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # MinIO does not implement S3 PutBucketCORS, so per-bucket CORS via
    # `mc cors set` is unsupported. CORS for browser PUT/GET is configured
    # at the server level via MINIO_API_CORS_ALLOW_ORIGIN on the minio service.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb -p local/vocabu-media-local
        mc mb -p local/vocabu-originals-local
        echo 'minio-init: buckets ready (CORS handled by MINIO_API_CORS_ALLOW_ORIGIN)'
    restart: 'no'

volumes:
  postgres-data:
  minio-data:
