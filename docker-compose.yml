services:
  postgres:
    image: postgres:18-alpine
    container_name: vocabu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocabu
      POSTGRES_PASSWORD: vocabu
      POSTGRES_DB: vocabu
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vocabu -d vocabu']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Pinned (VKB-170): minio-init's set -e relies on mc's idempotency, which
    # is a property of a specific release, not a contract — a floating tag
    # would let a Monday pull break every second `docker compose up`. Bumps
    # are deliberate diffs; keep both pins moving together.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: vocabu-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:3000'
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: vocabu-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # MinIO does not implement S3 PutBucketCORS, so per-bucket CORS via
    # `mc cors set` is unsupported. CORS for browser PUT/GET is configured
    # at the server level via MINIO_API_CORS_ALLOW_ORIGIN on the minio service.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb -p local/vocabu-media-local
        mc mb -p local/vocabu-originals-local
        # One user per bucket, mirroring the scoped R2 tokens the cloud
        # stages use (VKB-126) — so a credential mix-up fails locally too,
        # instead of only in production.
        for kind in media originals; do
          printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::vocabu-%s-local","arn:aws:s3:::vocabu-%s-local/*"]}]}' "$$kind" "$$kind" > /tmp/$$kind.json
          mc admin user add local vocabu-$$kind-local vocabu-$$kind-local-secret
          mc admin policy create local vocabu-$$kind-only /tmp/$$kind.json
          mc admin policy attach local vocabu-$$kind-only --user vocabu-$$kind-local
        done
        echo 'minio-init: buckets + scoped users ready (CORS handled by MINIO_API_CORS_ALLOW_ORIGIN)'
    restart: 'no'

volumes:
  postgres-data:
  minio-data:
